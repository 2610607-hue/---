<!doctype html>
<html lang="ko">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <meta name="theme-color" content="#f9f9f9" />
  <title>Study Manager</title>
  <script src="https://cdn.tailwindcss.com?plugins=forms,container-queries"></script>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&display=swap" rel="stylesheet" />
  <script src="https://unpkg.com/react@18/umd/react.production.min.js" crossorigin></script>
  <script src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js" crossorigin></script>
  <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
  <style>
    :root { --surface:#f9f9f9; --card:#fff; --low:#f3f3f3; --high:#e8e8e8; --variant:#e2e2e2; --text:#1a1c1c; --muted:#444748; --outline:#c4c7c7; --primary:#000; }
    * { box-sizing:border-box; } body { margin:0; background:var(--surface); color:var(--text); font-family:Inter,system-ui,sans-serif; -webkit-font-smoothing:antialiased; }
    body.dark { --surface:#121212; --card:#1d1d1d; --low:#252525; --high:#303030; --variant:#3c3c3c; --text:#f1f1f1; --muted:#c4c7c7; --outline:#5f6368; --primary:#fff; }
    .material-symbols-outlined { font-variation-settings:'FILL' 0,'wght' 300,'GRAD' 0,'opsz' 24; line-height:1; }
    button,input,select { font:inherit; } button { cursor:pointer; } .card-shadow { box-shadow:0 4px 12px rgba(0,0,0,.02); }
    .progress-ring-circle { transform:rotate(-90deg); transform-origin:50% 50%; transition:stroke-dashoffset .4s ease; }
    .app-header { height:56px; } .app-main { padding:80px 16px 96px; max-width:1024px; margin:auto; min-height:100vh; }
    .bottom-nav { height:64px; background:var(--card); border-color:var(--outline); } .nav-active { background:#1c1b1b; color:#858383; }
    .field { width:100%; border:1px solid var(--outline); border-radius:8px; background:transparent; padding:10px 12px; color:var(--text); outline:none; }
    .field:focus { border-color:var(--text); box-shadow:0 0 0 1px var(--text); } .modal-backdrop { background:rgba(0,0,0,.38); }
    .calendar-grid { display:grid; grid-template-columns:repeat(7,minmax(0,1fr)); } .day { min-height:80px; border-right:1px solid var(--outline); border-bottom:1px solid var(--outline); padding:8px; text-align:center; background:var(--card); }
    .day:nth-child(7n) { border-right:0; } .day.empty { background:color-mix(in srgb, var(--low) 30%, transparent); }
    @media (min-width:768px) { .day { min-height:100px; } }
  </style>
</head>
<body>
  <div id="root"></div>
  <script type="text/babel">
    const {useEffect,useMemo,useRef,useState} = React;
    const Store = {
      get(key, fallback) { try { const value=localStorage.getItem('study-manager:'+key); return value ? JSON.parse(value) : fallback; } catch { return fallback; } },
      set(key, value) { localStorage.setItem('study-manager:'+key, JSON.stringify(value)); }
    };
    const uid=()=>crypto.randomUUID ? crypto.randomUUID() : Date.now().toString(36)+Math.random().toString(36).slice(2);
    const today=()=>new Date().toISOString().slice(0,10);
    const dateLabel=(value)=>new Intl.DateTimeFormat('ko-KR',{month:'short',day:'numeric'}).format(new Date(value+'T00:00:00'));
    const duration=(seconds)=>[Math.floor(seconds/3600),Math.floor(seconds%3600/60),seconds%60].map(n=>String(n).padStart(2,'0')).join(':');
    const Icon=({children,filled=false,className=''})=><span className={'material-symbols-outlined '+className} style={filled?{'fontVariationSettings':"'FILL' 1"}:undefined}>{children}</span>;

    function Header({title,children}) { return <header className="app-header fixed inset-x-0 top-0 z-40 flex items-center justify-between border-b px-4" style={{background:'var(--surface)',borderColor:'var(--outline)'}}><div className="flex items-center gap-2"><div className="flex h-8 w-8 items-center justify-center rounded-full border" style={{borderColor:'var(--outline)'}}><Icon>school</Icon></div><h1 className="text-xl font-bold tracking-tight">{title||'Study Manager'}</h1></div>{children}</header>; }
    function Nav({page,setPage}) { const items=[['home','home','Home'],['problems','folder_open','Folders'],['timer','timer','Timer'],['calendar','calendar_today','Calendar'],['settings','settings','Settings']]; return <nav className="bottom-nav fixed inset-x-0 bottom-0 z-40 flex items-center justify-around border-t px-2">{items.map(([id,icon,label])=><button key={id} onClick={()=>setPage(id)} className={'flex min-w-12 flex-col items-center justify-center rounded-full px-3 py-1 text-xs transition-colors '+(page===id?'nav-active':'')} style={page===id?{}:{color:'var(--muted)'}}><Icon filled={page===id}>{icon}</Icon><span className="mt-1 text-[11px] font-medium tracking-wide">{label}</span></button>)}</nav>; }
    function Modal({title,children,onClose}) { return <div className="modal-backdrop fixed inset-0 z-50 flex items-end justify-center p-4 sm:items-center" onMouseDown={onClose}><div className="w-full max-w-md rounded-xl border p-4 shadow-xl" style={{background:'var(--card)',borderColor:'var(--outline)'}} onMouseDown={e=>e.stopPropagation()}><div className="mb-4 flex items-center justify-between"><h2 className="text-xl font-semibold">{title}</h2><button aria-label="닫기" onClick={onClose}><Icon>close</Icon></button></div>{children}</div></div>; }

    function Home({problems,goals,exams,sessions,setPage}) {
      const todaySeconds=sessions.filter(s=>s.date===today()).reduce((a,s)=>a+s.seconds,0); const complete=goals.filter(g=>g.status==='done').length; const rate=goals.length?Math.round(complete/goals.length*100):0;
      return <><Header/><main className="app-main"><section><p className="text-xs font-medium uppercase tracking-wider" style={{color:'var(--muted)'}}>Overview</p><h2 className="mt-1 text-2xl font-semibold">Welcome back</h2><div className="card-shadow mt-4 flex items-center gap-6 rounded-xl border p-6" style={{background:'var(--card)',borderColor:'var(--outline)'}}><div className="relative flex h-20 w-20 items-center justify-center"><svg className="h-full w-full"><circle cx="40" cy="40" r="36" fill="transparent" stroke="var(--variant)" strokeWidth="4"/><circle className="progress-ring-circle" cx="40" cy="40" r="36" fill="transparent" stroke="var(--primary)" strokeWidth="4" strokeLinecap="round" strokeDasharray="226.2" strokeDashoffset={226.2-(rate/100*226.2)}/></svg><span className="absolute text-xl font-semibold">{rate}%</span></div><div><h3 className="text-xl font-semibold">Daily Goal</h3><p className="mt-1 text-sm" style={{color:'var(--muted)'}}>오늘 목표 달성 현황을 확인하세요.</p></div></div></section>
      <section className="mt-8"><h3 className="mb-4 text-xl font-semibold">Quick Access</h3><div className="grid grid-cols-3 gap-4">{[['problems','folder_open','Folders'],['timer','timer','Timer'],['calendar','calendar_today','Calendar']].map(([id,icon,label])=><button key={id} onClick={()=>setPage(id)} className="flex flex-col items-center rounded-xl border p-4 transition-colors hover:opacity-75" style={{background:'var(--low)',borderColor:'var(--outline)'}}><Icon className="mb-1">{icon}</Icon><span className="text-xs font-medium tracking-wide">{label}</span></button>)}</div></section>
      <section className="mt-8"><div className="mb-4 flex items-center justify-between"><h3 className="text-xl font-semibold">Upcoming Exams</h3><button onClick={()=>setPage('settings')} className="text-xs font-medium" style={{color:'var(--muted)'}}>See all</button></div><div className="space-y-3">{exams.slice(0,3).map(e=><div key={e.id} className="card-shadow flex items-center gap-4 rounded-xl border p-4" style={{background:'var(--card)',borderColor:'var(--outline)'}}><div className="flex h-12 w-12 flex-col items-center justify-center rounded-lg" style={{background:'var(--high)'}}><span className="text-xs">{dateLabel(e.date).split(' ')[0]}</span><b>{new Date(e.date+'T00:00:00').getDate()}</b></div><div className="min-w-0 flex-1"><h4 className="font-semibold">{e.name}</h4><p className="truncate text-sm" style={{color:'var(--muted)'}}>{e.dday===0?'D-Day':e.dday>0?`D-${e.dday}`:'종료됨'}</p></div><Icon>chevron_right</Icon></div>)}{!exams.length&&<p className="rounded-xl border p-4 text-sm" style={{borderColor:'var(--outline)',color:'var(--muted)'}}>설정에서 학교를 검색하면 시험 일정을 불러옵니다.</p>}</div></section>
      <section className="mt-8"><h3 className="mb-4 text-xl font-semibold">Today</h3><div className="grid grid-cols-2 gap-4"><div className="rounded-xl border p-4" style={{background:'var(--card)',borderColor:'var(--outline)'}}><p className="text-xs uppercase tracking-wider" style={{color:'var(--muted)'}}>Study time</p><p className="mt-2 text-2xl font-bold">{duration(todaySeconds)}</p></div><div className="rounded-xl border p-4" style={{background:'var(--card)',borderColor:'var(--outline)'}}><p className="text-xs uppercase tracking-wider" style={{color:'var(--muted)'}}>Recent problems</p><p className="mt-2 text-2xl font-bold">{problems.length}</p></div></div></section></main></>;
    }

    function Problems({problems,setProblems}) {
      const [query,setQuery]=useState(''), [tag,setTag]=useState(''), [priority,setPriority]=useState(''), [showAdd,setShowAdd]=useState(false), [view,setView]=useState(null), [analyzing,setAnalyzing]=useState(false);
      const tags=[...new Set(problems.flatMap(p=>p.tags||[]))]; const filtered=problems.filter(p=>(!query||p.name.toLowerCase().includes(query.toLowerCase()))&&(!tag||p.tags.includes(tag))&&(!priority||p.priority===priority));
      const saveProblem=(problem)=>setProblems([problem,...problems]);
      const analyze=async(p)=>{ setAnalyzing(true); try { const r=await fetch('/api/generate',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({action:'analyze',file:{name:p.name,type:p.type,data:p.data}})}); const data=await r.json(); if(!r.ok) throw new Error(data.error); const next={...p,analysis:data.analysis,tags:[...new Set([...(p.tags||[]),...(data.analysis.tags||[])])],priority:data.analysis.priority||p.priority}; setProblems(problems.map(x=>x.id===p.id?next:x)); setView(next); } catch(e){alert(e.message||'AI 분석에 실패했습니다. GEMINI_API_KEY를 확인하세요.');} finally{setAnalyzing(false);} };
      return <><Header title="Study Manager"/><main className="app-main"><section><div className="mb-4 flex items-end justify-between"><div><p className="text-xs uppercase tracking-wider" style={{color:'var(--muted)'}}>Study materials</p><h2 className="mt-1 text-2xl font-semibold">My Folders</h2></div><button onClick={()=>setShowAdd(true)} className="flex items-center gap-1 rounded-lg px-3 py-2 text-sm font-semibold text-white" style={{background:'var(--primary)',color:'var(--surface)'}}><Icon>add</Icon>UPLOAD</button></div><div className="relative"><Icon className="absolute left-3 top-1/2 -translate-y-1/2" style={{color:'var(--muted)'}}>search</Icon><input value={query} onChange={e=>setQuery(e.target.value)} className="field pl-10" placeholder="Search problems" /></div></section>
      <section className="grid grid-cols-1 gap-4 md:grid-cols-3"><div className="rounded-xl border p-4" style={{background:'var(--card)',borderColor:'var(--outline)'}}><p className="mb-3 text-xs font-medium uppercase tracking-wider" style={{color:'var(--muted)'}}>Tag filter</p><select className="field" value={tag} onChange={e=>setTag(e.target.value)}><option value="">All tags</option>{tags.map(t=><option key={t}>{t}</option>)}</select></div><div className="rounded-xl border p-4" style={{background:'var(--card)',borderColor:'var(--outline)'}}><p className="mb-3 text-xs font-medium uppercase tracking-wider" style={{color:'var(--muted)'}}>Priority</p><select className="field" value={priority} onChange={e=>setPriority(e.target.value)}><option value="">All priorities</option><option>높음</option><option>중간</option><option>낮음</option></select></div><div className="rounded-xl border p-4" style={{background:'var(--card)',borderColor:'var(--outline)'}}><p className="text-xs font-medium uppercase tracking-wider" style={{color:'var(--muted)'}}>Saved problems</p><p className="mt-1 text-3xl font-bold">{problems.length}</p></div></section>
      <section className="mt-8"><div className="mb-4 flex items-center justify-between"><h3 className="text-xl font-semibold">All Problems</h3><span className="text-sm" style={{color:'var(--muted)'}}>{filtered.length} items</span></div><div className="space-y-3">{filtered.map(p=><button key={p.id} onClick={()=>setView(p)} className="card-shadow flex w-full items-center gap-4 rounded-xl border p-4 text-left" style={{background:'var(--card)',borderColor:'var(--outline)'}}><div className="flex h-12 w-12 shrink-0 items-center justify-center rounded-lg" style={{background:'var(--high)'}}><Icon>{p.type==='application/pdf'?'picture_as_pdf':'image'}</Icon></div><div className="min-w-0 flex-1"><h4 className="truncate font-semibold">{p.name}</h4><p className="mt-1 text-xs" style={{color:'var(--muted)'}}>{new Date(p.createdAt).toLocaleDateString('ko-KR')} · {p.priority}</p><div className="mt-2 flex flex-wrap gap-1">{p.tags.map(t=><span key={t} className="rounded-full px-2 py-0.5 text-[10px]" style={{background:'var(--low)',color:'var(--muted)'}}>{t}</span>)}</div></div><Icon>chevron_right</Icon></button>)}{!filtered.length&&<div className="rounded-xl border p-8 text-center text-sm" style={{borderColor:'var(--outline)',color:'var(--muted)'}}>업로드한 문제가 없습니다.</div>}</div></section></main>
      {showAdd&&<ProblemForm onClose={()=>setShowAdd(false)} onSave={p=>{saveProblem(p);setShowAdd(false);}}/>}{view&&<ProblemDetail problem={view} analyzing={analyzing} onClose={()=>setView(null)} onAnalyze={()=>analyze(view)} onUpdate={next=>{setProblems(problems.map(p=>p.id===next.id?next:p));setView(next);}} onDelete={()=>{setProblems(problems.filter(p=>p.id!==view.id));setView(null);}}/>}</>;
    }
    function ProblemForm({onClose,onSave}) { const [file,setFile]=useState(null),[tags,setTags]=useState(''),[priority,setPriority]=useState('중간'); const submit=async e=>{e.preventDefault(); if(!file)return alert('파일을 선택하세요.'); const data=await new Promise((resolve,reject)=>{const r=new FileReader();r.onload=()=>resolve(r.result);r.onerror=reject;r.readAsDataURL(file);}); onSave({id:uid(),name:file.name,type:file.type,data,createdAt:new Date().toISOString(),tags:tags.split(',').map(t=>t.trim()).filter(Boolean),priority});}; return <Modal title="문제 업로드" onClose={onClose}><form onSubmit={submit} className="space-y-3"><input className="field" type="file" accept="image/*,.pdf,application/pdf" onChange={e=>setFile(e.target.files[0])}/><input className="field" value={tags} onChange={e=>setTags(e.target.value)} placeholder="태그 (쉼표로 구분)"/><select className="field" value={priority} onChange={e=>setPriority(e.target.value)}><option>높음</option><option>중간</option><option>낮음</option></select><button className="w-full rounded-lg p-3 font-semibold text-white" style={{background:'var(--primary)',color:'var(--surface)'}}>저장</button></form></Modal>; }
    function ProblemDetail({problem,onClose,onAnalyze,onUpdate,onDelete,analyzing}) { const [tags,setTags]=useState(problem.tags.join(', ')),[priority,setPriority]=useState(problem.priority); const save=()=>onUpdate({...problem,tags:tags.split(',').map(t=>t.trim()).filter(Boolean),priority}); return <Modal title="문제 확인" onClose={onClose}><div className="space-y-4"><div className="max-h-72 overflow-auto rounded-lg border" style={{borderColor:'var(--outline)'}}>{problem.type==='application/pdf'?<a href={problem.data} target="_blank" className="block p-8 text-center underline">PDF 새 창에서 열기</a>:<img src={problem.data} alt={problem.name} className="w-full"/>}</div><p className="text-sm" style={{color:'var(--muted)'}}>{problem.name}</p><div className="grid grid-cols-2 gap-2"><input className="field text-sm" value={tags} onChange={e=>setTags(e.target.value)} placeholder="태그, 쉼표 구분"/><select className="field text-sm" value={priority} onChange={e=>setPriority(e.target.value)}><option>높음</option><option>중간</option><option>낮음</option></select></div><button onClick={save} className="w-full rounded-lg border p-2 text-sm font-semibold" style={{borderColor:'var(--outline)'}}>태그·중요도 저장</button>{problem.analysis&&<div className="rounded-lg p-3 text-sm" style={{background:'var(--low)'}}><b>AI 분석</b><p className="mt-2">{problem.analysis.subject} · {problem.analysis.unit} · 난이도 {problem.analysis.difficulty}</p><p className="mt-1">{problem.analysis.summary}</p></div>}<button disabled={analyzing} onClick={onAnalyze} className="w-full rounded-lg border p-3 text-sm font-semibold disabled:opacity-50" style={{borderColor:'var(--outline)'}}>{analyzing?'분석 중…':'Gemini로 문제 분석'}</button><button onClick={onDelete} className="w-full p-2 text-sm" style={{color:'#ba1a1a'}}>문제 삭제</button></div></Modal>; }

    function Timer({sessions,setSessions}) { const [seconds,setSeconds]=useState(0),[running,setRunning]=useState(false),[mode,setMode]=useState('timer'),[target,setTarget]=useState(25*60); useEffect(()=>{if(!running)return;const id=setInterval(()=>setSeconds(s=>{if(mode==='timer'&&s+1>=target){setRunning(false);return target;}return s+1;}),1000);return()=>clearInterval(id);},[running,mode,target]); const finish=()=>{if(seconds){setSessions([{id:uid(),date:today(),seconds,mode,createdAt:new Date().toISOString()},...sessions]);setSeconds(0);}setRunning(false);}; const displayed=mode==='timer'?Math.max(target-seconds,0):seconds; return <><Header/><main className="app-main flex flex-col items-center justify-center"><section className="flex w-full max-w-lg flex-col items-center text-center"><p className="text-xs font-medium uppercase tracking-wider" style={{color:'var(--muted)'}}>Focus session</p><h2 className="mt-1 text-2xl font-semibold">Study Timer</h2><div className="relative mt-8 flex h-64 w-64 items-center justify-center rounded-full border-8" style={{borderColor:'var(--variant)'}}><div><p className="text-4xl font-bold tracking-tight">{duration(displayed)}</p><p className="mt-2 text-sm" style={{color:'var(--muted)'}}>{mode==='timer'?'COUNTDOWN':'STOPWATCH'}</p></div></div><div className="mt-8 flex gap-3"><button onClick={()=>setMode(mode==='timer'?'stopwatch':'timer')} className="rounded-lg border px-4 py-3 text-sm font-semibold" style={{borderColor:'var(--outline)'}}>{mode==='timer'?'스톱워치':'타이머'}</button><button onClick={()=>setRunning(!running)} className="flex items-center gap-2 rounded-lg px-5 py-3 text-sm font-semibold" style={{background:'var(--primary)',color:'var(--surface)'}}><Icon>{running?'pause':'play_arrow'}</Icon>{running?'일시정지':'공부 시작'}</button></div>{mode==='timer'&&<div className="mt-4 flex gap-2">{[25,50,90].map(m=><button key={m} onClick={()=>{setTarget(m*60);setSeconds(0);}} className="rounded-full px-3 py-1 text-xs" style={{background:'var(--low)'}}>{m}m</button>)}</div>}<button onClick={finish} className="mt-5 text-sm underline" style={{color:'var(--muted)'}}>종료하고 기록 저장</button></section><section className="mt-8 grid w-full max-w-4xl grid-cols-3 gap-4"><div className="rounded-xl border p-4" style={{borderColor:'var(--outline)'}}><p className="text-xs" style={{color:'var(--muted)'}}>TODAY</p><p className="mt-2 text-2xl font-bold">{duration(sessions.filter(s=>s.date===today()).reduce((a,s)=>a+s.seconds,0))}</p></div><div className="rounded-xl border p-4" style={{borderColor:'var(--outline)'}}><p className="text-xs" style={{color:'var(--muted)'}}>SESSIONS</p><p className="mt-2 text-2xl font-bold">{sessions.length}</p></div><div className="rounded-xl border p-4" style={{borderColor:'var(--outline)'}}><p className="text-xs" style={{color:'var(--muted)'}}>MODE</p><p className="mt-2 text-lg font-bold">{mode==='timer'?'Timer':'Watch'}</p></div></section></main></>;
    }

    function Calendar({goals,setGoals}) { const [cursor,setCursor]=useState(new Date()),[editor,setEditor]=useState(null),[selected,setSelected]=useState(today()); const y=cursor.getFullYear(),m=cursor.getMonth(),first=new Date(y,m,1),days=new Date(y,m+1,0).getDate(),offset=(first.getDay()+6)%7,cells=Array.from({length:Math.ceil((offset+days)/7)*7},(_,i)=>i-offset+1),monthGoals=goals.filter(g=>g.end.slice(0,7)===`${y}-${String(m+1).padStart(2,'0')}`),done=monthGoals.filter(g=>g.status==='done').length,rate=monthGoals.length?Math.round(done/monthGoals.length*100):0,dayGoals=goals.filter(g=>g.start<=selected&&g.end>=selected),selectStatus=(id,status)=>setGoals(goals.map(g=>g.id===id?{...g,status}:g)),saveGoal=g=>{setGoals(goals.some(x=>x.id===g.id)?goals.map(x=>x.id===g.id?g:x):[...goals,g]);setEditor(null);}; return <><Header/><main className="app-main"><section className="mb-6 flex items-center justify-between"><div><p className="text-xs uppercase tracking-wider" style={{color:'var(--muted)'}}>Goals</p><h2 className="mt-1 text-2xl font-semibold">{y}년 {m+1}월</h2></div><div className="flex gap-2"><button onClick={()=>setCursor(new Date(y,m-1,1))} className="rounded-lg border p-2" style={{borderColor:'var(--outline)'}}><Icon>chevron_left</Icon></button><button onClick={()=>setCursor(new Date(y,m+1,1))} className="rounded-lg border p-2" style={{borderColor:'var(--outline)'}}><Icon>chevron_right</Icon></button></div></section><section className="overflow-hidden rounded-xl border" style={{borderColor:'var(--outline)'}}><div className="calendar-grid" style={{background:'var(--low)'}}>{['MON','TUE','WED','THU','FRI','SAT','SUN'].map(d=><div key={d} className="py-4 text-center text-xs font-medium" style={{color:'var(--muted)'}}>{d}</div>)}</div><div className="calendar-grid">{cells.map((d,i)=>{if(d<1||d>days)return <div key={i} className="day empty"/>;const ds=`${y}-${String(m+1).padStart(2,'0')}-${String(d).padStart(2,'0')}`,count=goals.filter(g=>g.start<=ds&&g.end>=ds).length;return <button key={i} onClick={()=>setSelected(ds)} className="day" style={selected===ds?{background:'color-mix(in srgb, var(--low) 70%, transparent)'}:{}}><span className={ds===today()?'font-bold':''}>{d}</span>{count>0&&<div className="mt-2 flex justify-center gap-1">{Array.from({length:Math.min(3,count)},(_,x)=><i key={x} className="h-1.5 w-1.5 rounded-full" style={{background:'var(--primary)'}}/>)}</div>}</button>})}</div></section><section className="mt-8"><div className="mb-4 flex items-center justify-between"><h3 className="text-xl font-semibold">{dateLabel(selected)}</h3><button onClick={()=>setEditor({id:uid(),title:'',start:selected,end:selected,status:'pending'})} className="flex items-center gap-1 text-xs font-medium"><Icon>add</Icon>ADD GOAL</button></div><div className="space-y-3">{dayGoals.map(g=><div key={g.id} className="flex items-center gap-4 rounded-lg border p-4" style={{background:'var(--card)',borderColor:'var(--outline)'}}><div className="h-12 w-2 rounded-full" style={{background:g.status==='done'?'var(--primary)':'var(--outline)'}}/><div className="min-w-0 flex-1"><h4 className="font-semibold">{g.title}</h4><p className="text-sm" style={{color:'var(--muted)'}}>{g.start} — {g.end}</p></div><button onClick={()=>setEditor(g)} aria-label="목표 수정"><Icon>edit</Icon></button>{selected>=g.end&&g.status==='pending'?<div className="flex gap-1"><button onClick={()=>selectStatus(g.id,'done')} className="rounded border px-2 py-1 text-xs" style={{borderColor:'var(--outline)'}}>달성</button><button onClick={()=>selectStatus(g.id,'missed')} className="rounded border px-2 py-1 text-xs" style={{borderColor:'var(--outline)'}}>미달성</button></div>:<span className="text-xs" style={{color:'var(--muted)'}}>{g.status==='done'?'달성함':g.status==='missed'?'미달성':'진행 중'}</span>}</div>)}{!dayGoals.length&&<p className="rounded-lg border p-4 text-sm" style={{borderColor:'var(--outline)',color:'var(--muted)'}}>이 날짜에 등록된 목표가 없습니다.</p>}</div></section><section className="mt-8 grid grid-cols-2 gap-4"><div className="rounded-xl border p-4" style={{borderColor:'var(--outline)'}}><p className="text-xs uppercase" style={{color:'var(--muted)'}}>Month progress</p><p className="mt-2 text-3xl font-bold">{rate}%</p></div><div className="rounded-xl border p-4" style={{borderColor:'var(--outline)'}}><p className="text-xs uppercase" style={{color:'var(--muted)'}}>Overall success</p><p className="mt-2 text-3xl font-bold">{goals.length?Math.round(goals.filter(g=>g.status==='done').length/goals.filter(g=>g.status!=='pending').length*100)||0:0}%</p></div></section></main>{editor&&<GoalForm goal={editor} onClose={()=>setEditor(null)} onSave={saveGoal}/>}</>;
    }
    function GoalForm({goal,onClose,onSave}) { const [title,setTitle]=useState(goal.title),[start,setStart]=useState(goal.start),[end,setEnd]=useState(goal.end); return <Modal title={goal.title?'목표 수정':'목표 등록'} onClose={onClose}><form onSubmit={e=>{e.preventDefault();if(end<start)return alert('종료일은 시작일 이후여야 합니다.');onSave({...goal,title,start,end});}} className="space-y-3"><input className="field" required value={title} onChange={e=>setTitle(e.target.value)} placeholder="목표"/><label className="block text-sm">시작일<input className="field mt-1" type="date" value={start} onChange={e=>setStart(e.target.value)}/></label><label className="block text-sm">종료일<input className="field mt-1" type="date" value={end} onChange={e=>setEnd(e.target.value)}/></label><button className="w-full rounded-lg p-3 font-semibold" style={{background:'var(--primary)',color:'var(--surface)'}}>저장</button></form></Modal>; }

    function Settings({settings,setSettings,exams,setExams}) { const [school,setSchool]=useState(settings.school?.name||''),[results,setResults]=useState([]),[loading,setLoading]=useState(false); const search=async()=>{if(!school.trim())return;setLoading(true);try{const r=await fetch('/api/generate',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({action:'schools',schoolName:school})});const data=await r.json();if(!r.ok)throw new Error(data.error);setResults(data.schools||[]);}catch(e){alert(e.message||'학교 검색 실패');}finally{setLoading(false);}};const select=async s=>{setSettings({...settings,school:s});setSchool(s.name);setResults([]);setLoading(true);try{const r=await fetch('/api/generate',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({action:'schedule',school:s})});const data=await r.json();if(!r.ok)throw new Error(data.error);setExams(data.exams||[]);}catch(e){alert(e.message||'학사일정 조회 실패');}finally{setLoading(false);}};const backup=()=>{const blob=new Blob([JSON.stringify({problems:Store.get('problems',[]),goals:Store.get('goals',[]),sessions:Store.get('sessions',[]),settings},null,2)],{type:'application/json'}),url=URL.createObjectURL(blob),a=document.createElement('a');a.href=url;a.download='study-manager-backup.json';a.click();URL.revokeObjectURL(url);};return <><Header/><main className="app-main"><h2 className="text-2xl font-semibold">Settings</h2><section className="mt-6 rounded-xl border p-4" style={{background:'var(--card)',borderColor:'var(--outline)'}}><h3 className="font-semibold">학교 변경</h3><p className="mt-1 text-sm" style={{color:'var(--muted)'}}>NEIS Open API에서 학교와 시험 일정을 조회합니다.</p><div className="mt-4 flex gap-2"><input className="field" value={school} onChange={e=>setSchool(e.target.value)} onKeyDown={e=>e.key==='Enter'&&search()} placeholder="학교명 검색"/><button onClick={search} disabled={loading} className="rounded-lg px-4 text-sm font-semibold" style={{background:'var(--primary)',color:'var(--surface)'}}>검색</button></div>{loading&&<p className="mt-3 text-sm">불러오는 중…</p>}{results.length>0&&<div className="mt-3 overflow-hidden rounded-lg border" style={{borderColor:'var(--outline)'}}>{results.map(s=><button key={s.code} onClick={()=>select(s)} className="block w-full border-b p-3 text-left text-sm last:border-0" style={{borderColor:'var(--outline)'}}>{s.name}<span className="block text-xs" style={{color:'var(--muted)'}}>{s.address}</span></button>)}</div>}</section><section className="mt-4 rounded-xl border p-4" style={{background:'var(--card)',borderColor:'var(--outline)'}}><label className="flex items-center justify-between"><span><b>알림 설정</b><small className="mt-1 block" style={{color:'var(--muted)'}}>브라우저 알림 권한</small></span><input type="checkbox" checked={settings.notifications} onChange={async e=>{if(e.target.checked&&'Notification'in window)await Notification.requestPermission();setSettings({...settings,notifications:e.target.checked});}}/></label></section><section className="mt-4 rounded-xl border p-4" style={{background:'var(--card)',borderColor:'var(--outline)'}}><label className="flex items-center justify-between"><span><b>다크모드</b><small className="mt-1 block" style={{color:'var(--muted)'}}>화면 테마 변경</small></span><input type="checkbox" checked={settings.dark} onChange={e=>setSettings({...settings,dark:e.target.checked})}/></label></section><section className="mt-4 rounded-xl border p-4" style={{background:'var(--card)',borderColor:'var(--outline)'}}><h3 className="font-semibold">데이터 백업</h3><p className="mt-1 text-sm" style={{color:'var(--muted)'}}>현재 기기의 학습 데이터를 JSON으로 저장합니다.</p><button onClick={backup} className="mt-4 rounded-lg border px-4 py-2 text-sm font-semibold" style={{borderColor:'var(--outline)'}}>백업 다운로드</button></section></main></>;
    }
    function App(){const [page,setPage]=useState('home'),[problems,setProblemsRaw]=useState(()=>Store.get('problems',[])),[goals,setGoalsRaw]=useState(()=>Store.get('goals',[])),[sessions,setSessionsRaw]=useState(()=>Store.get('sessions',[])),[settings,setSettingsRaw]=useState(()=>Store.get('settings',{dark:false,notifications:false,school:null})),[exams,setExamsRaw]=useState(()=>Store.get('exams',[]));const persistent=(key,setter)=>(v)=>{const next=typeof v==='function'?v(Store.get(key,[])):v;setter(next);Store.set(key,next);};const setProblems=persistent('problems',setProblemsRaw),setGoals=persistent('goals',setGoalsRaw),setSessions=persistent('sessions',setSessionsRaw),setExams=persistent('exams',setExamsRaw),setSettings=v=>{setSettingsRaw(v);Store.set('settings',v);};useEffect(()=>document.body.classList.toggle('dark',settings.dark),[settings.dark]);const props={problems,setProblems,goals,setGoals,sessions,setSessions,exams,setExams,settings,setSettings};const pages={home:<Home {...props} setPage={setPage}/>,problems:<Problems {...props}/>,timer:<Timer {...props}/>,calendar:<Calendar {...props}/>,settings:<Settings {...props}/>};return <>{pages[page]}<Nav page={page} setPage={setPage}/></>};
    ReactDOM.createRoot(document.getElementById('root')).render(<App/>);
  </script>
</body>
